server:
  port: 8080
spring:
  application:
    name: spring-ai-practice
  ai:
    chat:
      client:
        enabled: false
#    model:
#      chat: deepseek  # 聊天模型
#      image: openai  # 图像模型
#      audio:  # 音频模型
#        speech: openai  # 文本转语音
#        transcription: openai  # 语音转文本
#      embedding: openai  # 嵌入模型
#      moderation: openai  # 内容审核模型
    deepseek:
      api-key: sk-bbae6eb97396449f9d9531e2ff0f409e
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.6
    openai:
      api-key: sk-demo
      base-url: https://api.openai.com
      projectId: spring-ai-practice
      organization-id: YU
      chat:
        options:
          model: gpt-4o-mini
          maxToken: 10000
          maxCompletionTokens: 10000
          temperature: 0.8

# Swagger配置
springdoc:
  swagger-ui:
    path: /doc.html
    enabled: true
    packages-to-scan: cn.javastack.ai.controller
    operations-sorter: method   # 按方法排序
    tags-sorter: alpha          # 按字母排序
    show-actuator: true         # 显示 Actuator 端点
  api-docs:
    path: /v3/api-docs
    enabled: true
  info:
    title: "Spring AI 接口"
    version: "1.0.0"
    description: "Spring AI 接口文档"
    contact:
      name: "team"
      email: "team@example.com"
    license:
      name: "Apache 2.0"
      url: "https://www.apache.org/licenses/LICENSE-2.0"
