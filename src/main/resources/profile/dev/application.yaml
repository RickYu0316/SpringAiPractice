server:
  port: 8080
spring:
  application:
    name: spring-ai-practice
  ai:
    chat:
      client:
        enabled: false
#    model:
#      chat: deepseek  # 聊天模型
#      image: openai  # 图像模型
#      audio:  # 音频模型
#        speech: openai  # 文本转语音
#        transcription: openai  # 语音转文本
#      embedding: openai  # 嵌入模型
#      moderation: openai  # 内容审核模型
    deepseek:
      api-key: sk-bbae6eb97396449f9d9531e2ff0f409e
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.6
    openai:
      api-key: sk-demo
      base-url: https://api.openai.com
      projectId: spring-ai-practice
      organization-id: YU
      chat:
        options:
          model: gpt-4o-mini
          maxToken: 10000
          maxCompletionTokens: 10000
          temperature: 0.8
    # OpenRouter配置
    open-router:
      base-url: ${spring.ai.open-router.OPENROUTER_BASE_URL:https://openrouter.ai/api}
      api-key: ${spring.ai.open-router.OPENROUTER_API_KEY}
      app-name: ${spring.application.name}
      site-url: http://localhost:8080
      default-model: openai/gpt-4o-mini
      chat-completions-path: /v1/chat/completions
      # 重要配置，可配置到环境变量
      OPENROUTER_BASE_URL: https://openrouter.ai/api
      OPENROUTER_API_KEY: sk-demo

# springdoc配置
springdoc:
  packages-to-scan: cn.javastack.ai.controller
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs
    enabled: true
  info:
    title: "Spring AI 接口"
    version: "1.0.0"
    description: "Spring AI 接口文档"
    contact:
      name: "team"
      email: "team@example.com"
    license:
      name: "Apache 2.0"
      url: "https://www.apache.org/licenses/LICENSE-2.0"
