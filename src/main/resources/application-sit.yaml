spring:
  ai:
    chat:
      client:
        enabled: false
    #    model:
    #      chat: deepseek  # 聊天模型
    #      image: openai  # 图像模型
    #      audio:  # 音频模型
    #        speech: openai  # 文本转语音
    #        transcription: openai  # 语音转文本
    #      embedding: openai  # 嵌入模型
    #      moderation: openai  # 内容审核模型
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
          temperature: 0.6
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://api.openai.com
      projectId: ${spring.application.name}
      organization-id: YU
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          maxToken: 10000
          maxCompletionTokens: 10000
          temperature: 0.8
    # OpenRouter配置
    open-router:
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api}
      api-key: ${OPENROUTER_API_KEY}
      app-name: ${spring.application.name}
      site-url: http://localhost:8080
      default-model: ${OPENROUTER_DEFAULT_MODEL:openai/gpt-4o-mini}
      chat-completions-path: /v1/chat/completions
