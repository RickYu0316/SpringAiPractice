spring:
  ai:
    chat:
      client:
        enabled: false
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: ${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
          temperature: 0.6
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: https://openrouter.ai/api/v1
      chat:
        options:
          model: ${OPENROUTER_CHAT_MODEL:xiaomi/mimo-v2.5}
          max-completion-tokens: 100000
          temperature: 0.8
      audio:
        # 文本转语音
        speech:
          model: ${OPENROUTER_TTS_MODEL:x-ai/grok-voice-tts-1.0}
          voice: eve
          response-format: mp3
        # 语音转文字
        transcription:
          model: ${OPENROUTER_STT_MODEL:x-ai/grok-voice-tts-1.0}
    # Ollama本地大模型
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:deepseek-r1:7b}
          temperature: 0.6
    # OpenRouter
    open-router:
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api}
      api-key: ${OPENROUTER_API_KEY}
      app-name: ${spring.application.name}
      site-url: ${OPENROUTER_SITE_URL:http://localhost:8080}
      default-model: ${OPENROUTER_DEFAULT_MODEL:xiaomi/mimo-v2.5}
      chat-completions-path: /v1/chat/completions
      image-model: ${OPENROUTER_IMAGE_MODEL:bytedance-seed/seedream-4.5}
      video-model: ${OPENROUTER_VIDEO_MODEL:bytedance/seedance-2.0}
      image-path: /v1/images
      video-path: /v1/videos
